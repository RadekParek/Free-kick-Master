name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build offline Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify the runner's preinstalled Android SDK
        shell: bash
        run: |
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::The hosted runner did not provide ANDROID_HOME."
            exit 1
          fi
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              echo "::error::Android SDK 35 and the command-line SDK manager are missing."
              exit 1
            fi
            if ! "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"; then
              echo "::error::SDK manager could not install Android SDK 35."
              exit 1
            fi
          fi
          echo "Using Android SDK 35 at $ANDROID_HOME"
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and test physics
        run: npm run check
      - name: Build and bundle the offline game
        run: npm run android:sync
      - name: Verify all player media is bundled locally
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          const bundled = 'android/app/src/main/assets/public';
          for (const name of readdirSync('public/players')) {
            if (!readFileSync(`public/players/${name}`).equals(readFileSync(`${bundled}/players/${name}`))) {
              throw new Error(`Offline player asset differs: ${name}`);
            }
          }
          if (!readFileSync('public/textures/stadium-crowd.webp').equals(readFileSync(`${bundled}/textures/stadium-crowd.webp`))) {
            throw new Error('Offline crowd texture differs');
          }
          for (const name of readdirSync('public/models')) {
            if (!readFileSync(`public/models/${name}`).equals(readFileSync(`${bundled}/models/${name}`))) {
              throw new Error(`Offline anatomy asset/license differs: ${name}`);
            }
          }
          console.log('All portraits, crowd, anatomy and model licenses are bundled byte-for-byte.');
          NODE
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build installable debug APK and run Android lint
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug lintDebug 2>&1 | tee gradle-build.log
      - name: Surface build failures in check annotations
        if: failure()
        run: |
          python - <<'PYDIAG'
          from pathlib import Path
          log = Path('android/gradle-build.log')
          if log.exists():
              tail = '\n'.join(log.read_text(errors='replace').splitlines()[-70:])
              escaped = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Android build diagnostics::{escaped}')
          PYDIAG
      - name: Name and checksum the APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/Free-Kick-Master-debug.apk
          cd apk
          sha256sum Free-Kick-Master-debug.apk > SHA256SUMS.txt
      - name: Upload Android APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Free-Kick-Master-Android
          path: apk/
          retention-days: 30
          if-no-files-found: error
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Android-lint
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
